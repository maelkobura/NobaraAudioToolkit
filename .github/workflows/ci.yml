name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
      # Lets the job request an OIDC token for NuGet Trusted Publishing.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build the native library
        shell: pwsh
        run: ./scripts/build-native.ps1

      - name: Test
        run: dotnet test tests/Nobara.AudioToolkit.Tests -c Release

      - name: Pack
        run: dotnet pack src/Nobara.AudioToolkit -c Release -o artifacts/packages

      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: artifacts/packages/*.nupkg

      - name: Check the tag against the version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".Substring(1)
          if (-not (Test-Path "artifacts/packages/Nobara.AudioToolkit.$version.nupkg")) {
            throw "The tag ${{ github.ref_name }} does not match the version of the project."
          }

      - name: Log in to NuGet
        if: startsWith(github.ref, 'refs/tags/v')
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        # dotnet nuget push does not expand a wildcard path on Windows,
        # so the step names the package of the tag.
        run: |
          $version = "${{ github.ref_name }}".Substring(1)
          dotnet nuget push "artifacts/packages/Nobara.AudioToolkit.$version.nupkg" --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json
