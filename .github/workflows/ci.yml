name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build the native library
        shell: pwsh
        run: ./scripts/build-native.ps1

      - name: Test
        run: dotnet test tests/Nobara.AudioToolkit.Tests -c Release

      - name: Pack
        run: dotnet pack src/Nobara.AudioToolkit -c Release -o artifacts/packages

      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: artifacts/packages/*.nupkg

      - name: Check the tag against the version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".Substring(1)
          if (-not (Test-Path "artifacts/packages/Nobara.AudioToolkit.$version.nupkg")) {
            throw "The tag ${{ github.ref_name }} does not match the version of the project."
          }

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        run: dotnet nuget push artifacts/packages/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
